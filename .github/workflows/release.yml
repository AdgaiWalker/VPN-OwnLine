name: CD - Multi-Asset Release Automation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install locked Python preflight dependencies
        run: |
          pip install --no-input --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Install CI-only property fuzzing engine (hypothesis)
        run: |
          pip install --no-input --disable-pip-version-check hypothesis==6.170.17

      - name: Run Test Gate (Must Pass 100%)
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh

      - name: Package Distribution Bundle
        run: |
          VERSION="${GITHUB_REF_NAME:-v0.0.0}"
          ARCHIVE_NAME="vpn-ownline-${VERSION}.tar.gz"
          tar --exclude='.git' \
              --exclude='.pytest_cache' \
              --exclude='.ruff_cache' \
              --exclude='__pycache__' \
              --exclude='*.pyc' \
              -czf "$ARCHIVE_NAME" \
              server deploy web skills \
              scripts/drift.py scripts/verify.sh scripts/ops/cf_origin_lock.sh \
              requirements.lock README.md LICENSE ownline.py "启动安装.command" "启动安装.bat"
          echo "ARCHIVE_NAME=$ARCHIVE_NAME" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ env.ARCHIVE_NAME }}
          generate_release_notes: true
