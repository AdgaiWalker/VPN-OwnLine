name: CI - Automated Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击运行

jobs:
  test:
    name: Run Quality Gate (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install locked Python preflight dependencies
        run: |
          pip install --no-input --disable-pip-version-check --require-hashes -r requirements.lock

      - name: Run Full Offline Quality Gate
        run: |
          chmod +x scripts/test.sh
          ./scripts/test.sh
