# 宝塔 Windows / Linux Nginx 顶层 Stream 4 层预分流配置
#
# 目的：
#   解决宝塔面板 Web 服务占用 443 端口，导致 sing-box Reality 只能使用非标 8443 的高危问题。
#   利用 TLS ClientHello 中的 SNI 进行 4 层嗅探：
#   - 当 SNI == www.microsoft.com 时，转发至 127.0.0.1:8443 (sing-box Reality)
#   - 当 SNI == 其他域名时，转发至 127.0.0.1:10443 (宝塔原有 Web 服务)
#
# 使用方法：
#   1. 将本段追加至 nginx.conf 顶层（与 http {} 同级，不能写在 http {} 内部）
#   2. 将宝塔原所有网站的 listen 443 改为 listen 10443
#   3. 执行 nginx -t 检查语法，无误后 nginx -s reload

stream {
    map $ssl_preread_server_name $backend_router {
        www.microsoft.com   singbox_reality_backend;
        default             baota_web_backend;
    }

    upstream singbox_reality_backend {
        server 127.0.0.1:8443;
    }

    upstream baota_web_backend {
        server 127.0.0.1:10443;
    }

    server {
        listen 443;
        proxy_pass $backend_router;
        ssl_preread on;
    }
}
