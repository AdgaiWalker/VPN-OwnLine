  <section class="panel-card" id="card-serving">
    <div id="install-task" class="check-result-box" style="display:none;margin:0 0 18px" role="status">
      <strong id="install-task-title">安装任务</strong>
      <p class="small muted" id="install-task-message" style="margin:4px 0 8px"></p>
      <button class="btn tiny" id="install-task-refresh" type="button">刷新进度</button>
      <button class="btn tiny" id="install-task-dismiss" type="button" disabled>关闭</button>
    </div>

    <!-- State A: Main Dashboard -->
    <div id="view-dashboard">
      <div class="hero-stage-card">
        <div class="hero-stage-top">
          <div class="sub-header">
            <h1 class="main-title" id="serving-node-title" data-i18n="main_title">连接配置</h1>
            <span class="sub-status" id="serving-node-ip" style="display:none"></span>
          </div>

          <!-- Unready State Box -->
          <div id="client-unready-box" style="padding:14px 16px;background:var(--surface-soft);border:1px dashed var(--line);border-radius:10px;text-align:center">
            <div id="unready-title" style="font-size:13.5px;color:var(--accent);font-weight:500;margin-bottom:2px" data-i18n="connecting_svc">正在连接服务...</div>
            <div class="small muted" id="unready-note"></div>
            <button id="btn-retry-state" class="btn tiny" type="button" hidden style="margin-top:8px" onclick="window.ownlineRetryState && window.ownlineRetryState()">重试连接</button>
          </div>

          <!-- Primary Client Actions (Hero CTA) -->
          <div id="client-ready-box" style="display:none">
            <div class="apple-hero-bar" style="margin-top:0">
              <button id="btn-hero-connect" class="btn primary apple-hero-connect" type="button" onclick="window.ownlineOpenClientHub()">
                <svg class="ico apple-hero-icon" width="15" height="15" aria-hidden="true"><use href="#i-zap"/></svg>
                <span class="apple-hero-title" data-i18n="connect_device">连接本机</span>
                <span id="client-device-badge" class="apple-device-pill">检测中...</span>
              </button>
              <button class="btn apple-hero-copy" type="button" id="btn-copy-sub" title="复制链接" aria-label="复制链接">
                <svg class="ico" width="16" height="16"><use href="#i-copy"/></svg>
              </button>
              <button class="btn apple-hero-qr" type="button" id="btn-hero-qr" onclick="window.ownlineOpenQrModal()" title="扫码连接" aria-label="扫码连接">
                <svg class="ico" width="16" height="16"><use href="#i-qr"/></svg>
              </button>
            </div>
            <div id="copy-note" class="small" role="status" style="display:none;margin-top:6px;color:var(--ok)"></div>
            <p id="import-note" class="small muted" role="status" style="margin:6px 0 0"></p>
          </div>
        </div>

        <!-- Quota Hero Summary Strip (1-line calm view; details collapsed until clicked) -->
        <div id="quota-hero-banner" class="quota-hero-card" style="display:none">
          <button type="button" class="quota-strip-trigger" id="quota-strip-toggle" aria-expanded="false" aria-controls="quota-details-panel" onclick="window.ownlineToggleQuotaDetails(this)">
            <span class="quota-strip-left">
              <span class="quota-strip-label" data-i18n="quota_hero_title">本月出海总流量</span>
              <span id="quota-hero-status" class="tag ok" style="font-size:11px;padding:1px 7px" data-i18n="quota_status_ok">充足</span>
            </span>
            <span class="bar quota-strip-bar" aria-hidden="true">
              <i id="quota-hero-fill" style="--pct:0"></i>
              <span id="quota-time-tick" class="quota-bar-tick quota-tick-time" hidden title="周期时间进度"></span>
              <span id="quota-breaker-tick" class="quota-bar-tick quota-tick-breaker" hidden title="保护熔断线"></span>
            </span>
            <span class="quota-strip-usage">
              <b id="quota-hero-used">0</b> / <span id="quota-hero-total" class="muted">0 GB</span>
              <span id="quota-hero-percent" class="muted">(0%)</span>
            </span>
            <svg class="ico quota-strip-chevron" width="14" height="14" aria-hidden="true"><use href="#i-chevron-down"/></svg>
          </button>
          <div id="quota-hero-nodes-safe" class="quota-strip-alert" style="display:none" data-i18n="quota_safe_lbl"></div>

          <div id="quota-details-panel" class="quota-details-panel" hidden>
            <div class="quota-runway-bar">
              <div class="quota-runway-metrics">
                <div class="quota-runway-item">
                  <span class="quota-runway-lbl" data-i18n="quota_safe_rem_lbl">安全可用</span>
                  <b id="quota-hero-rem" class="quota-runway-val">-- GB</b>
                  <span id="quota-runway-sub" class="quota-runway-sub"></span>
                </div>
                <div class="quota-runway-item">
                  <span class="quota-runway-lbl" data-i18n="quota_avg7_lbl">近 7 日日均</span>
                  <b id="quota-avg-7d" class="quota-runway-val">--</b>
                </div>
                <div class="quota-runway-item">
                  <b id="quota-cycle-rem" class="quota-runway-val">--</b>
                  <span id="quota-cycle-pct" class="quota-runway-sub"></span>
                </div>
              </div>
              <button type="button" class="quiet-inline-link" data-i18n="quota_rules_link" onclick="window.ownlineToggleQuota()">熔断阈值与账单核对</button>
            </div>

            <!-- 14-day Daily Burn Trend + Daily Budget Reference Line -->
            <div id="traffic-breakdown-row" class="quota-chart-card">
              <div class="quota-chart-head">
                <span class="quota-chart-title" data-i18n="quota_trend_14d">近 14 日消耗趋势</span>
                <span class="quota-chart-meta">
                  <span id="quota-chart-budget" class="quota-chart-budget" hidden></span>
                  <span id="quota-chart-readout" class="quota-chart-readout">--</span>
                </span>
              </div>
              <div id="quota-chart-wrap" class="quota-chart-wrap">
                <svg id="quota-chart-svg" class="quota-chart-svg" viewBox="0 0 560 56" preserveAspectRatio="none" role="img" aria-label="14-day daily traffic trend"></svg>
              </div>
              <div id="quota-chart-cold" class="quota-chart-cold" hidden></div>
              <div id="quota-chart-axis" class="quota-chart-axis">
                <span id="quota-axis-start"></span>
                <span id="quota-axis-mid"></span>
                <span id="quota-axis-end"></span>
              </div>
            </div>

            <!-- Bottleneck & Topology Runway Bars (hidden for single node) -->
            <div id="quota-topology-list" class="quota-topology-list" hidden></div>
          </div>
        </div>
      </div>

      <!-- Apple Client Hub Dialog (Action Sheet) -->
