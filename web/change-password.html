<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>设置密码 · 长青 VPN-OwnLine</title>
  <style>
    body{margin:0;background:#f5f4ed;color:#171b23;font:16px system-ui,-apple-system,sans-serif}
    main{max-width:420px;margin:10vh auto;padding:24px}
    h1{font-size:24px;margin:0 0 10px} p{line-height:1.6;color:#575c64}
    label{display:block;margin:18px 0 6px} input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #c9c9c1;border-radius:6px;font:inherit}
    button{width:100%;margin-top:24px;padding:12px;background:#1b365d;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}
    button:disabled{opacity:.6} #status{min-height:1.5em;color:#a3342a} :focus-visible{outline:3px solid #537cad;outline-offset:2px}
  </style>
</head>
<body><main>
  <h1>设置管理密码</h1>
  <p>首次使用请修改初始密码；之后也可以在这里更改。服务器登录密码不会改变。</p>
  <form id="form">
    <label for="current">当前密码</label>
    <input id="current" type="password" autocomplete="current-password" required>
    <label for="next">新密码</label>
    <input id="next" type="password" autocomplete="new-password" minlength="12" required>
    <label for="confirm">再次输入新密码</label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
    <button id="submit" type="submit">保存</button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
</main>
<script>
'use strict';
document.getElementById('form').addEventListener('submit', async function(event) {
  event.preventDefault();
  const status = document.getElementById('status'), button = document.getElementById('submit');
  if (!window.isSecureContext) { status.textContent = '请使用浏览器认可的安全连接访问管理网页。'; return; }
  const current = document.getElementById('current').value;
  const next = document.getElementById('next').value;
  const confirm = document.getElementById('confirm').value;
  if (next !== confirm || next === current) { status.textContent = '两次输入应一致，且新密码不能与初始密码相同。'; return; }
  button.disabled = true; status.textContent = '正在保存…';
  try {
    const response = await fetch('/api/password/change', {method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({current:current,new:next,confirm:confirm}), cache:'no-store'});
    const result = await response.json();
    if (!response.ok || !result.ok) { status.textContent = result.error || '保存失败，请重试。'; return; }
    document.getElementById('form').reset();
    status.textContent = '密码已修改。请使用新密码重新登录。';
    window.location.replace('/');
  } catch (_) { status.textContent = '暂时无法确认结果，请尝试使用新密码登录。'; }
  finally { button.disabled = false; }
});
</script></body></html>
