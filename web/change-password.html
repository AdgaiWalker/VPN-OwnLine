<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <title>Account Settings · OwnLine</title>
  <style>
    :root {
      color-scheme: light dark;
      --paper: #f5f7fa;
      --canvas-bg: radial-gradient(ellipse 80% 50% at 15% -12%, rgba(16, 185, 129, 0.08) 0%, transparent 58%), radial-gradient(ellipse 75% 48% at 88% -10%, rgba(56, 189, 248, 0.08) 0%, transparent 56%), linear-gradient(180deg, #f7f9fc 0%, #eff3f8 100%);
      --card-bg: #ffffff;
      --soft: #edf2f7;
      --ink: #0f172a;
      --muted: #4e5d73;
      --border: #dde4ed;
      --border-input: #8494a7;
      --navy: #163a5f;
      --btn-primary-bg: #163a5f;
      --btn-primary-hover: #0f2b48;
      --accent-fg: #ffffff;
      --accent-soft: rgba(22, 58, 95, 0.09);
      --ok: #15803d;
      --danger: #c2410c;
      --radius: 10px;
      --shadow-card: 0 1px 2px rgba(15, 23, 42, 0.03), 0 8px 24px -12px rgba(15, 23, 42, 0.07);
      accent-color: var(--navy);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #0b0f14;
        --canvas-bg: radial-gradient(ellipse 80% 48% at 14% -12%, rgba(16, 185, 129, 0.11) 0%, transparent 58%), radial-gradient(ellipse 72% 45% at 88% -10%, rgba(56, 189, 248, 0.09) 0%, transparent 56%), linear-gradient(180deg, #0b0f14 0%, #0e141d 100%);
        --card-bg: #121821;
        --soft: #1f2937;
        --ink: #edf2f7;
        --muted: #96a6bc;
        --border: #232e3e;
        --border-input: #566882;
        --navy: #60a5fa;
        --btn-primary-bg: #2563eb;
        --btn-primary-hover: #1d4ed8;
        --accent-fg: #ffffff;
        --accent-soft: rgba(96, 165, 250, 0.16);
        --ok: #4ade80;
        --danger: #f87171;
        --shadow-card: 0 2px 16px rgba(0, 0, 0, 0.32);
      }
    }
    @media (forced-colors: active) {
      :root {
        --shadow-card: none;
      }
      body {
        background-image: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: clamp(24px, 4vw, 48px) clamp(16px, 3vw, 24px);
      background-color: var(--paper);
      background-image: var(--canvas-bg);
      background-repeat: no-repeat;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: 15.5px;
      line-height: 1.6;
      min-height: 100vh;
      min-block-size: 100dvh;
      -webkit-font-smoothing: antialiased;
    }
    main {
      max-width: 460px;
      margin: 4vh auto 40px;
      padding: clamp(24px, 4vw, 34px);
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow-card);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }
    .evergreen-icon {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      background: #11141b;
      border: 1px solid rgba(255, 255, 255, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
    }
    .brand-title {
      font-weight: 600;
      font-size: 16px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .brand-pill {
      font-size: 11px;
      font-weight: 600;
      color: var(--navy);
      background: var(--accent-soft);
      padding: 2px 7px;
      border-radius: 4px;
      line-height: 1.2;
    }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 5px 10px;
      font: inherit;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
      flex: none;
      transition: background-color 140ms ease, color 140ms ease, border-color 140ms ease;
    }
    .lang-btn:hover {
      background: var(--soft);
      color: var(--ink);
      border-color: var(--border-input);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0 0 8px;
      color: var(--ink);
    }
    p.desc {
      margin: 0 0 20px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
    }
    .account-chip {
      margin-bottom: 18px;
      padding: 10px 14px;
      background: var(--soft);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .label-hint {
      font-weight: normal;
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }
    input {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid var(--border-input);
      border-radius: var(--radius);
      font: inherit;
      font-size: 14.5px;
      background: var(--card-bg);
      color: var(--ink);
      transition: border-color 140ms ease, box-shadow 140ms ease;
    }
    input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }
    .pw-wrap input {
      padding-right: 44px;
    }
    .pw-toggle {
      position: absolute;
      right: 4px;
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: 0;
      border-radius: 6px;
      color: var(--muted);
      cursor: pointer;
      transition: background-color 140ms ease, color 140ms ease;
    }
    .pw-toggle:hover {
      background: var(--soft);
      color: var(--ink);
    }
    :where(button, a, input):focus-visible {
      outline: 2px solid var(--navy);
      outline-offset: 2px;
    }
    button.submit-btn {
      width: 100%;
      min-height: 46px;
      margin-top: 24px;
      padding: 12px;
      background: var(--btn-primary-bg);
      color: var(--accent-fg);
      border: 0;
      border-radius: var(--radius);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease, transform 100ms ease;
    }
    button.submit-btn:hover:not(:disabled) {
      background: var(--btn-primary-hover);
    }
    @media (prefers-reduced-motion: no-preference) {
      button.submit-btn:active:not(:disabled) {
        transform: scale(0.985);
      }
    }
    button.submit-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #status {
      min-height: 1.5em;
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--danger);
      text-align: center;
    }
    #status.success {
      color: var(--ok);
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--navy);
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<main>
  <div class="header-bar">
    <div class="brand">
      <div class="evergreen-icon" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 32 32" fill="none">
          <defs>
            <linearGradient id="eg-cp-loop" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6ee7b7"/>
              <stop offset="45%" stop-color="#10b981"/>
              <stop offset="100%" stop-color="#06b6d4"/>
            </linearGradient>
          </defs>
          <path d="M9 11.5C6.5 11.5 4.8 13.4 4.8 16C4.8 18.6 6.5 20.5 9 20.5C12.8 20.5 15.6 16 16 16C16.4 16 19.2 20.5 23 20.5C25.5 20.5 27.2 18.6 27.2 16C27.2 13.4 25.5 11.5 23 11.5C19.2 11.5 16.4 16 16 16C15.6 16 12.8 11.5 9 11.5Z" stroke="url(#eg-cp-loop)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="16" cy="16" r="2.2" fill="#ffffff"/>
        </svg>
      </div>
      <span class="brand-title">Evergreen</span>
      <span class="brand-pill">OwnLine</span>
    </div>
    <button type="button" id="lang-toggle" class="lang-btn" onclick="toggleLang()">中文</button>
  </div>
  <h1 id="title">Change Login Credentials</h1>
  <p class="desc" id="desc">Update your administrator username and password. You will need to log in again with the new credentials.</p>
  <div class="account-chip">
    <span style="color:var(--muted)" id="lbl-curr-account">Current Account:</span>
    <strong id="display-username" style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink)">admin</strong>
  </div>
  <form id="form">
    <label for="current"><span id="lbl-current">Current Password</span></label>
    <div class="pw-wrap">
      <input id="current" type="password" autocomplete="current-password" required>
      <button type="button" class="pw-toggle" data-target="current" onclick="togglePw('current', this)" aria-label="Show password">
        <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <label for="username"><span id="lbl-username">New Username</span> <span class="label-hint" id="hint-username">(leave empty to keep current)</span></label>
    <input id="username" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" data-lpignore="true" data-1p-ignore="true" placeholder="Leave empty to keep current">

    <label for="next"><span id="lbl-next">New Password</span> <span class="label-hint" id="hint-next">(at least 12 characters)</span></label>
    <div class="pw-wrap">
      <input id="next" type="password" autocomplete="new-password" minlength="12" required>
      <button type="button" class="pw-toggle" data-target="next" onclick="togglePw('next', this)" aria-label="Show password">
        <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <label for="confirm"><span id="lbl-confirm">Confirm New Password</span></label>
    <div class="pw-wrap">
      <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>
      <button type="button" class="pw-toggle" data-target="confirm" onclick="togglePw('confirm', this)" aria-label="Show password">
        <svg class="eye-open" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-closed" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>

    <button id="submit" type="submit" class="submit-btn"><span id="btn-text">Save Changes</span></button>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="/" class="back-link" id="link-back">← Back to Dashboard</a>
  </form>
</main>

<script>
'use strict';
const I18N = {
  en: {
    title: 'Change Login Credentials',
    desc: 'Update your administrator username and password. You will need to log in again with the new credentials.',
    lblCurrAccount: 'Current Account:',
    lblCurrent: 'Current Password',
    lblUser: 'New Username',
    hintUser: '(leave empty to keep current)',
    placeholderUser: 'Leave empty to keep current',
    lblNext: 'New Password',
    hintNext: '(at least 12 characters)',
    lblConfirm: 'Confirm New Password',
    btnSave: 'Save Changes',
    backLink: '← Back to Dashboard',
    langToggle: '中文',
    showPw: 'Show password',
    hidePw: 'Hide password',
    secReq: 'Please use a secure connection approved by your browser.',
    mismatch: 'Passwords must match, and the new password must differ from current.',
    saving: 'Saving changes…',
    saveFailed: 'Save failed. Please check inputs and try again.',
    saved: 'Credentials updated. Please log in with your new credentials.',
    unconfirmed: 'Could not confirm result immediately. Please try logging in with new credentials.'
  },
  zh: {
    title: '修改管理登录凭据',
    desc: '首次使用请修改初始密码；之后也可随时修改用户名与密码。更改后需使用新凭据重新登录。',
    lblCurrAccount: '当前账号：',
    lblCurrent: '当前密码',
    lblUser: '新用户名',
    hintUser: '（如不修改请留空）',
    placeholderUser: '如不修改请留空',
    lblNext: '新密码',
    hintNext: '（至少 12 个字符）',
    lblConfirm: '再次输入新密码',
    btnSave: '保存更改',
    backLink: '← 返回管理首页',
    langToggle: 'English',
    showPw: '显示密码',
    hidePw: '隐藏密码',
    secReq: '请使用浏览器认可的安全连接访问管理网页。',
    mismatch: '两次输入的新密码必须一致，且不能与当前密码相同。',
    saving: '正在保存更改…',
    saveFailed: '保存失败，请检查输入后重试。',
    saved: '凭据已修改。请使用新凭据重新登录。',
    unconfirmed: '暂时无法确认结果，请尝试使用新凭据重新登录。'
  }
};

let currentLang = localStorage.getItem('ownline_lang') || ((typeof navigator !== 'undefined' && /^zh\b/i.test(navigator.language || '')) ? 'zh' : 'en');
let currentUsername = 'admin';

function updatePwToggleLabel(btn, visible) {
  const dict = I18N[currentLang] || I18N.en;
  if (!btn) return;
  btn.setAttribute('aria-label', visible ? dict.hidePw : dict.showPw);
  btn.setAttribute('aria-pressed', visible ? 'true' : 'false');
}

function togglePw(id, btn) {
  const input = document.getElementById(id);
  if (!input) return;
  const visible = input.type === 'password';
  input.type = visible ? 'text' : 'password';
  const eyeOpen = btn.querySelector('.eye-open');
  const eyeClosed = btn.querySelector('.eye-closed');
  if (eyeOpen) eyeOpen.style.display = visible ? 'none' : '';
  if (eyeClosed) eyeClosed.style.display = visible ? '' : 'none';
  updatePwToggleLabel(btn, visible);
}

function applyLang() {
  const dict = I18N[currentLang] || I18N.en;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
  document.title = currentLang === 'zh' ? '修改管理登录凭据 · OwnLine' : 'Account Settings · OwnLine';
  document.getElementById('title').textContent = dict.title;
  document.getElementById('desc').textContent = dict.desc;
  const currEl = document.getElementById('lbl-curr-account');
  if (currEl) currEl.textContent = dict.lblCurrAccount;
  document.getElementById('lbl-current').textContent = dict.lblCurrent;
  document.getElementById('lbl-username').textContent = dict.lblUser;
  document.getElementById('hint-username').textContent = dict.hintUser;
  const userIn = document.getElementById('username');
  if (userIn) userIn.placeholder = dict.placeholderUser;
  document.getElementById('lbl-next').textContent = dict.lblNext;
  document.getElementById('hint-next').textContent = dict.hintNext;
  document.getElementById('lbl-confirm').textContent = dict.lblConfirm;
  document.getElementById('btn-text').textContent = dict.btnSave;
  document.getElementById('link-back').textContent = dict.backLink;
  document.getElementById('lang-toggle').textContent = dict.langToggle;
  document.querySelectorAll('.pw-toggle').forEach((btn) => {
    const target = document.getElementById(btn.getAttribute('data-target') || '');
    updatePwToggleLabel(btn, Boolean(target && target.type === 'text'));
  });
}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'zh' : 'en';
  localStorage.setItem('ownline_lang', currentLang);
  applyLang();
}

async function init() {
  applyLang();
  const clearStatus = () => {
    const st = document.getElementById('status');
    if (st) {
      st.className = '';
      st.textContent = '';
    }
  };
  const formEl = document.getElementById('form');
  if (formEl) {
    formEl.addEventListener('input', clearStatus);
    formEl.addEventListener('invalid', clearStatus, true);
  }
  try {
    const [uRes, sRes] = await Promise.allSettled([
      fetch('/api/user', { cache: 'no-store' }),
      fetch('/api/password/state', { cache: 'no-store' }),
    ]);
    if (uRes.status === 'fulfilled' && uRes.value.ok) {
      const data = await uRes.value.json();
      if (data.username) {
        currentUsername = data.username;
        const disp = document.getElementById('display-username');
        if (disp) disp.textContent = data.username;
      }
    }
    if (sRes.status === 'fulfilled' && sRes.value.ok) {
      const stData = await sRes.value.json();
      const backLink = document.getElementById('link-back');
      if (backLink && stData && stData.required === true) {
        backLink.style.display = 'none';
      }
    }
  } catch (_) {}
}

document.getElementById('form').addEventListener('submit', async function(event) {
  event.preventDefault();
  const dict = I18N[currentLang] || I18N.en;
  const status = document.getElementById('status'), button = document.getElementById('submit');
  status.className = '';
  if (!window.isSecureContext) {
    status.textContent = dict.secReq;
    return;
  }
  const current = document.getElementById('current').value;
  const next = document.getElementById('next').value;
  const confirm = document.getElementById('confirm').value;
  const username = document.getElementById('username').value.trim();

  const isChangingUser = username && username !== currentUsername;
  const isChangingPass = !!next;

  if (!isChangingUser && !isChangingPass) {
    status.textContent = currentLang === 'zh' ? '未做任何修改（如需修改请提供新密码或新用户名）' : 'No changes detected. Please provide a new username or new password.';
    return;
  }

  if (isChangingPass) {
    if (next !== confirm || (next === current && !isChangingUser)) {
      status.textContent = dict.mismatch;
      return;
    }
  }

  button.disabled = true;
  status.textContent = dict.saving;
  try {
    const payload = { current: current };
    if (isChangingPass) {
      payload.new = next;
      payload.confirm = confirm;
    }
    if (isChangingUser) {
      payload.username = username;
    }
    const response = await fetch('/api/password/change', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      cache: 'no-store'
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      status.textContent = result.error || dict.saveFailed;
      return;
    }
    status.className = 'success';
    status.textContent = dict.saved;
    document.getElementById('form').reset();
    setTimeout(() => {
      window.location.replace('/');
    }, 1500);
  } catch (_) {
    status.textContent = dict.unconfirmed;
  } finally {
    button.disabled = false;
  }
});

init();
</script>
</body>
</html>
