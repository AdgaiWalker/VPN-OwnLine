<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Account Settings · OwnLine</title>
  <style>
    :root {
      --paper: #f5f4ed;
      --card-bg: #fcfbf7;
      --ink: #1f1d18;
      --muted: #5e5a52;
      --border: #dcd8cd;
      --border-dark: #b8b3a4;
      --navy: #1b365d;
      --navy-hover: #264a7c;
      --danger: #b23b2a;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    main {
      max-width: 440px;
      margin: 8vh auto 40px;
      padding: 32px 28px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--navy);
    }
    .lang-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 4px 8px;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      font-weight: 500;
    }
    .lang-btn:hover {
      background: var(--paper);
      color: var(--ink);
    }
    h1 {
      font-size: 22px;
      font-weight: 600;
      margin: 0 0 8px;
      color: var(--ink);
    }
    p.desc {
      margin: 0 0 24px;
      font-size: 13.5px;
      line-height: 1.6;
      color: var(--muted);
    }
    label {
      display: block;
      margin: 16px 0 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }
    .label-hint {
      font-weight: normal;
      font-size: 12px;
      color: var(--muted);
      margin-left: 4px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-dark);
      border-radius: var(--radius);
      font: inherit;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
    }
    input:focus {
      outline: none;
      border-color: var(--navy);
      box-shadow: 0 0 0 2px rgba(27,54,93,0.15);
    }
    button.submit-btn {
      width: 100%;
      margin-top: 24px;
      padding: 12px;
      background: var(--navy);
      color: #fff;
      border: 0;
      border-radius: var(--radius);
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    button.submit-btn:hover:not(:disabled) {
      background: var(--navy-hover);
    }
    button.submit-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      min-height: 1.5em;
      margin: 16px 0 0;
      font-size: 13px;
      color: var(--danger);
      text-align: center;
    }
    #status.success {
      color: #1a6f3b;
    }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: var(--navy);
      text-decoration: none;
    }
    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
<main>
  <div class="header-bar">
    <div class="brand">Evergreen · OwnLine</div>
    <button type="button" id="lang-toggle" class="lang-btn" onclick="toggleLang()">中文</button>
  </div>
  <h1 id="title">Change Login Credentials</h1>
  <p class="desc" id="desc">Update your administrator username and password. You will need to log in again with the new credentials.</p>
  <form id="form">
    <label for="current"><span id="lbl-current">Current Password</span></label>
    <input id="current" type="password" autocomplete="current-password" required>

    <label for="username"><span id="lbl-username">New Username</span> <span class="label-hint" id="hint-username">(leave unchanged if keeping current)</span></label>
    <input id="username" type="text" autocomplete="username" placeholder="admin">

    <label for="next"><span id="lbl-next">New Password</span> <span class="label-hint" id="hint-next">(at least 12 characters)</span></label>
    <input id="next" type="password" autocomplete="new-password" minlength="12" required>

    <label for="confirm"><span id="lbl-confirm">Confirm New Password</span></label>
    <input id="confirm" type="password" autocomplete="new-password" minlength="12" required>

    <button id="submit" type="submit" class="submit-btn"><span id="btn-text">Save Changes</span></button>
    <p id="status" role="status" aria-live="polite"></p>
    <a href="/" class="back-link" id="link-back">← Back to Dashboard</a>
  </form>
</main>

<script>
'use strict';
const I18N = {
  en: {
    title: 'Change Login Credentials',
    desc: 'Update your administrator username and password. You will need to log in again with the new credentials.',
    lblCurrent: 'Current Password',
    lblUser: 'New Username',
    hintUser: '(leave unchanged if keeping current)',
    lblNext: 'New Password',
    hintNext: '(at least 12 characters)',
    lblConfirm: 'Confirm New Password',
    btnSave: 'Save Changes',
    backLink: '← Back to Dashboard',
    langToggle: '中文',
    secReq: 'Please use a secure connection approved by your browser.',
    mismatch: 'Passwords must match, and the new password must differ from current.',
    saving: 'Saving changes…',
    saveFailed: 'Save failed. Please check inputs and try again.',
    saved: 'Credentials updated. Please log in with your new credentials.',
    unconfirmed: 'Could not confirm result immediately. Please try logging in with new credentials.'
  },
  zh: {
    title: '修改管理登录凭据',
    desc: '首次使用请修改初始密码；之后也可随时修改用户名与密码。更改后需使用新凭据重新登录。',
    lblCurrent: '当前密码',
    lblUser: '新用户名',
    hintUser: '（如不修改用户名可保持原样）',
    lblNext: '新密码',
    hintNext: '（至少 12 个字符）',
    lblConfirm: '再次输入新密码',
    btnSave: '保存更改',
    backLink: '← 返回管理首页',
    langToggle: 'English',
    secReq: '请使用浏览器认可的安全连接访问管理网页。',
    mismatch: '两次输入的新密码必须一致，且不能与当前密码相同。',
    saving: '正在保存更改…',
    saveFailed: '保存失败，请检查输入后重试。',
    saved: '凭据已修改。请使用新凭据重新登录。',
    unconfirmed: '暂时无法确认结果，请尝试使用新凭据重新登录。'
  }
};

let currentLang = localStorage.getItem('ownline_lang') || 'en';

function applyLang() {
  const dict = I18N[currentLang] || I18N.en;
  document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
  document.getElementById('title').textContent = dict.title;
  document.getElementById('desc').textContent = dict.desc;
  document.getElementById('lbl-current').textContent = dict.lblCurrent;
  document.getElementById('lbl-username').textContent = dict.lblUser;
  document.getElementById('hint-username').textContent = dict.hintUser;
  document.getElementById('lbl-next').textContent = dict.lblNext;
  document.getElementById('hint-next').textContent = dict.hintNext;
  document.getElementById('lbl-confirm').textContent = dict.lblConfirm;
  document.getElementById('btn-text').textContent = dict.btnSave;
  document.getElementById('link-back').textContent = dict.backLink;
  document.getElementById('lang-toggle').textContent = dict.langToggle;
}

function toggleLang() {
  currentLang = currentLang === 'en' ? 'zh' : 'en';
  localStorage.setItem('ownline_lang', currentLang);
  applyLang();
}

async function init() {
  applyLang();
  try {
    const res = await fetch('/api/user', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data.username) {
        document.getElementById('username').value = data.username;
        document.getElementById('username').placeholder = data.username;
      }
    }
  } catch (_) {}
}

document.getElementById('form').addEventListener('submit', async function(event) {
  event.preventDefault();
  const dict = I18N[currentLang] || I18N.en;
  const status = document.getElementById('status'), button = document.getElementById('submit');
  status.className = '';
  if (!window.isSecureContext) {
    status.textContent = dict.secReq;
    return;
  }
  const current = document.getElementById('current').value;
  const next = document.getElementById('next').value;
  const confirm = document.getElementById('confirm').value;
  const username = document.getElementById('username').value.trim();

  if (next !== confirm || (next === current && !username)) {
    status.textContent = dict.mismatch;
    return;
  }
  button.disabled = true;
  status.textContent = dict.saving;
  try {
    const payload = { current: current, new: next, confirm: confirm };
    if (username) {
      payload.username = username;
    }
    const response = await fetch('/api/password/change', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
      cache: 'no-store'
    });
    const result = await response.json();
    if (!response.ok || !result.ok) {
      status.textContent = result.error || dict.saveFailed;
      return;
    }
    status.className = 'success';
    status.textContent = dict.saved;
    document.getElementById('form').reset();
    setTimeout(() => {
      window.location.replace('/');
    }, 1500);
  } catch (_) {
    status.textContent = dict.unconfirmed;
  } finally {
    button.disabled = false;
  }
});

init();
</script>
</body>
</html>
